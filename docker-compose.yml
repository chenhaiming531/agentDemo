services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langgraph_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DATABASE:-langgraph_db}
    # 生产环境数据库不对外暴露端口（容器间走内网网络即可）；
    # 如需从外部调试（如 DataGrip 连服务器上的库），取消下面注释
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langgraph_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langgraph_backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-openai}
      - MODEL_NAMES=${MODEL_NAMES:-["qwen-plus"]}
      - MODEL_BASE_URL=${MODEL_BASE_URL}
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-text-embedding-v3}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL}
      - RERANK_MODEL=${RERANK_MODEL}
      - TOKEN_BEARER_URL=${TOKEN_BEARER_URL:-/api/v1/auth/login}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRY_MINS=${ACCESS_TOKEN_EXPIRY_MINS:-1440}
      - REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS:-1}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-langgraph_db}
      - PGVECTOR_COLLECTION_NAME=${PGVECTOR_COLLECTION_NAME:-my_collection}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - langgraph_network
    restart: on-failure:3

  # React 前端（生产）：nginx 托管静态文件 + 反代 /api 到 backend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: langgraph_web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - langgraph_network
    restart: on-failure:3

volumes:
  postgres_data:

networks:
  langgraph_network:
    driver: bridge